[package]
name = "advent_2024"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow = "1"
conv = "0.3"
regex = "1"
humantime = "2"
indexmap = { version = "2.7", features = ["rayon"] }
indicatif = { version = "0.17", features = ["rayon"] }
itertools = "0.13"
rayon = "1.10"

[profile.release]
strip = "symbols"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(tarpaulin_include)'] }